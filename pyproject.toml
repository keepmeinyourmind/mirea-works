[project]
name = "study-bot"
version = "0.1.0"
description = "Личный бот: собирает учебные задания из Telegram (пересылка/группа) и портала вуза и присылает сводку"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "apscheduler>=3.10,<4",
    "anthropic>=0.70",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "aiohttp-socks>=0.10",
    "cryptography>=43",
]

[project.optional-dependencies]
portal-browser = ["playwright>=1.47"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
