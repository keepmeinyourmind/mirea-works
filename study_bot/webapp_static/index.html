<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyBot</title>
<script>
  // Оформление до первой отрисовки, чтобы не мигало (точный выбор потом придёт из CloudStorage)
  try {
    var th = JSON.parse(localStorage.getItem("theme") || "{}");
    if (th.palette) document.documentElement.dataset.palette = th.palette;
  } catch (e) {}
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main id="list-screen" class="screen">
  <header class="top">
    <div class="hello">
      <span class="muted" id="today-label"></span>
      <h1 class="display" id="headline">Задания</h1>
      <span class="pts" id="sum" hidden></span>
    </div>
    <div class="top-right">
      <svg class="ring" id="ring" width="52" height="52" viewBox="0 0 52 52" role="img" hidden>
        <circle class="bg" cx="26" cy="26" r="21" fill="none" stroke-width="5"></circle>
        <circle class="fg" id="ring-fg" cx="26" cy="26" r="21" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 132" transform="rotate(-90 26 26)"></circle>
        <text id="ring-text" x="26" y="30" text-anchor="middle"></text>
      </svg>
      <button class="icon-btn" id="theme-btn" aria-label="Оформление"><i class="ti ti-palette"></i></button>
    </div>
  </header>
  <div class="week" id="week"></div>
  <div id="hero"></div>
  <div class="late-wrap" id="late"></div>
  <div class="chips" id="chips"></div>
  <div class="gitems" id="list" style="gap: 16px"></div>
  <div class="empty" id="empty" hidden>
    <i class="ti ti-confetti"></i>
    <b>Открытых заданий нет</b>
    <span>Перешли боту сообщение с заданием или добавь его кнопкой ниже.</span>
  </div>
  <div class="error" id="error" hidden></div>
  <div class="fab-wrap"><button class="main" id="new-btn"><i class="ti ti-plus"></i> Новое задание</button></div>
</main>

<div class="sheet" id="theme-sheet" hidden>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="theme-h">
    <div class="sheet-head">
      <h2 id="theme-h">Оформление</h2>
      <button class="icon-btn" id="theme-close" aria-label="Закрыть"><i class="ti ti-x"></i></button>
    </div>
    <h3>Цвета</h3>
    <div class="palettes" id="palettes"></div>
    <h3>Тема</h3>
    <div class="modes" id="modes">
      <button data-mode="auto" title="Как в Telegram">Авто</button>
      <button data-mode="light">Светлая</button>
      <button data-mode="dark">Тёмная</button>
    </div>
  </div>
</div>

<main id="edit-screen" class="screen" hidden>
  <div class="dev-bar" id="dev-back" hidden><button class="link" id="back-btn"><i class="ti ti-arrow-left"></i> Назад</button></div>
  <h1 class="edit-h display" id="edit-title">Задание</h1>
  <form id="form" novalidate>
    <div class="fld"><label for="f-title">Что сделать</label>
      <input id="f-title" autocomplete="off" placeholder="Лаба 4: сдать отчёт" maxlength="300"></div>
    <div class="fld"><label for="f-subject">Предмет</label>
      <input id="f-subject" list="subjects" autocomplete="off" placeholder="Без предмета"><datalist id="subjects"></datalist></div>
    <div class="row2">
      <div class="fld"><label for="f-date">Срок</label><input id="f-date" type="date"></div>
      <div class="fld"><label for="f-time">Время</label><input id="f-time" type="time" value="23:59"></div>
    </div>
    <div class="fld"><label for="f-points">Баллы</label>
      <div class="inline"><input id="f-points" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Не указано"><span id="points-hint" class="hint"></span></div></div>
    <div class="fld" id="url-field"><label for="f-url">Ссылка</label>
      <input id="f-url" type="url" inputmode="url" placeholder="https://online-edu.mirea.ru/mod/assign/view.php?id=…"></div>
    <div class="form-error" id="form-error" role="alert"></div>
  </form>
  <div id="status-box"></div>
  <a id="open-link" class="openlink" target="_blank" rel="noopener" hidden></a>
  <div class="actions">
    <button class="main" id="save-btn" hidden>Сохранить</button>
    <button class="danger-link" id="delete-btn"><i class="ti ti-trash"></i> Удалить задание</button>
  </div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
